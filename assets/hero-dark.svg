<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Danil — Build systems. Ship products.</title>
  <desc id="desc">Banner: Danil, independent product engineer building web apps, CRMs and AI tools. Pipeline: idea, spec, system, product.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #f0f6fc; }
    .muted { fill: #9198a1; }
    .accent { fill: #4493f8; }
    .stage { fill: #0d1117; stroke: #3d444d; stroke-width: 1.5; animation: stage 6s ease-in-out infinite; }
    .stage-label { fill: #9198a1; animation: stage-label 6s ease-in-out infinite; }
    .s2 { animation-delay: 1.2s; } .s3 { animation-delay: 2.4s; } .s4 { animation-delay: 3.6s; }
    @keyframes stage { 0%, 22%, 100% { fill: #0d1117; stroke: #3d444d; } 6%, 16% { fill: #132c4d; stroke: #4493f8; } }
    @keyframes stage-label { 0%, 22%, 100% { fill: #9198a1; } 6%, 16% { fill: #4493f8; } }
    .pulse { animation: pulse 6s linear infinite; }
    @keyframes pulse { 0% { transform: translateX(0); opacity: 0; } 4% { opacity: 1; } 60% { transform: translateX(298px); opacity: 1; } 64%, 100% { transform: translateX(298px); opacity: 0; } }
    .caret { animation: caret 1.1s steps(1) infinite; }
    @keyframes caret { 0%, 55% { fill-opacity: 1; } 56%, 100% { fill-opacity: 0; } }
    .float-a { animation: float 7s ease-in-out infinite; }
    .float-b { animation: float 7s ease-in-out -2.3s infinite; }
    .float-c { animation: float 7s ease-in-out -4.6s infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) {
      .stage, .stage-label, .pulse, .caret, .float-a, .float-b, .float-c { animation: none; }
      .pulse { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f1b30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4493f8" stop-opacity="0.22"/><stop offset="1" stop-color="#4493f8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#263142"/>
    </pattern>
    <linearGradient id="dots-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/><stop offset="0.55" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0.5"/>
    </linearGradient>
    <mask id="dots-mask"><rect width="1280" height="400" fill="url(#dots-fade)"/></mask>
    <clipPath id="frame"><rect width="1280" height="400" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#dots)" mask="url(#dots-mask)"/>
    <ellipse cx="1010" cy="190" rx="360" ry="250" fill="url(#glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="398.5" rx="19.5" fill="none" stroke="#3d444d" stroke-width="1.5"/>

  <text x="64" y="76" class="mono muted" font-size="15" letter-spacing="3">DANIL · CHISTOWHITE</text>
  <text x="64" y="170" class="sans ink" font-size="74" font-weight="700" letter-spacing="-2.5">Build systems.</text>
  <text x="64" y="252" class="sans accent" font-size="74" font-weight="700" letter-spacing="-2.5">Ship products.<tspan class="caret mono" font-weight="400" dx="6">_</tspan></text>
  <text x="66" y="298" class="sans muted" font-size="22">Independent product engineer · web apps, CRMs &amp; AI tools</text>

  <g>
    <circle class="pulse" cx="146" cy="346" r="4" fill="#4493f8"/>
    <rect class="stage s1" x="64" y="330" width="78" height="32" rx="8"/>
    <text class="stage-label s1 mono" x="103" y="351" text-anchor="middle" font-size="14" letter-spacing="2">IDEA</text>
    <path d="M152 346h20" stroke="#3d444d" stroke-width="2"/>
    <path d="M167 341l5 5-5 5" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="stage s2" x="182" y="330" width="78" height="32" rx="8"/>
    <text class="stage-label s2 mono" x="221" y="351" text-anchor="middle" font-size="14" letter-spacing="2">SPEC</text>
    <path d="M270 346h20" stroke="#3d444d" stroke-width="2"/>
    <path d="M285 341l5 5-5 5" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="stage s3" x="300" y="330" width="100" height="32" rx="8"/>
    <text class="stage-label s3 mono" x="350" y="351" text-anchor="middle" font-size="14" letter-spacing="2">SYSTEM</text>
    <path d="M410 346h20" stroke="#3d444d" stroke-width="2"/>
    <path d="M425 341l5 5-5 5" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="stage s4" x="440" y="330" width="114" height="32" rx="8"/>
    <text class="stage-label s4 mono" x="497" y="351" text-anchor="middle" font-size="14" letter-spacing="2">PRODUCT</text>
  </g>

  <!-- Right side: the kinds of products — web app, tablet kiosk, Telegram mini app -->
  <g class="float-a">
    <rect x="770" y="70" width="340" height="214" rx="14" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
    <path d="M770 104h340" stroke="#3d444d" stroke-width="1.5"/>
    <circle cx="790" cy="87" r="5" fill="#2a313c"/><circle cx="806" cy="87" r="5" fill="#2a313c"/><circle cx="822" cy="87" r="5" fill="#2a313c"/>
    <rect x="850" y="80" width="180" height="14" rx="7" fill="#1c222b" stroke="#2a313c"/>
    <rect x="792" y="124" width="150" height="14" rx="4" fill="#f0f6fc" opacity="0.85"/>
    <rect x="792" y="146" width="200" height="9" rx="4" fill="#2a313c"/>
    <rect x="792" y="162" width="170" height="9" rx="4" fill="#2a313c"/>
    <rect x="792" y="184" width="84" height="26" rx="8" fill="#4493f8"/>
    <rect x="792" y="226" width="96" height="40" rx="8" fill="#1c222b" stroke="#2a313c"/>
    <rect x="898" y="226" width="96" height="40" rx="8" fill="#1c222b" stroke="#2a313c"/>
    <rect x="1004" y="226" width="86" height="40" rx="8" fill="#1c222b" stroke="#2a313c"/>
  </g>
  <g class="float-b">
    <rect x="930" y="186" width="214" height="156" rx="18" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
    <rect x="944" y="200" width="186" height="128" rx="8" fill="#0d1117" stroke="#2a313c"/>
    <rect x="958" y="214" width="96" height="10" rx="5" fill="#f0f6fc" opacity="0.8"/>
    <rect x="958" y="238" width="50" height="50" rx="8" fill="#132c4d" stroke="#4493f8" stroke-width="1.5"/>
    <rect x="1016" y="238" width="50" height="50" rx="8" fill="#1c222b" stroke="#2a313c"/>
    <rect x="1074" y="238" width="44" height="50" rx="8" fill="#1c222b" stroke="#2a313c"/>
    <rect x="958" y="300" width="160" height="14" rx="7" fill="#2a313c"/>
  </g>
  <g class="float-c">
    <rect x="1112" y="92" width="112" height="214" rx="20" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
    <rect x="1122" y="104" width="92" height="190" rx="12" fill="#0d1117" stroke="#2a313c"/>
    <rect x="1150" y="111" width="36" height="5" rx="2.5" fill="#2a313c"/>
    <rect x="1130" y="130" width="62" height="24" rx="10" fill="#1c222b" stroke="#2a313c"/>
    <rect x="1144" y="164" width="62" height="24" rx="10" fill="#4493f8"/>
    <rect x="1130" y="198" width="72" height="34" rx="10" fill="#1c222b" stroke="#2a313c"/>
    <rect x="1130" y="262" width="76" height="22" rx="11" fill="#132c4d" stroke="#4493f8"/>
  </g>
  <text x="1216" y="370" text-anchor="end" class="mono muted" font-size="14" letter-spacing="2">WROCŁAW, PL</text>
</svg>
